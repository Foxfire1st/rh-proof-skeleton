[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-pipeline"
version = "0.1.0"
description = "Deterministic Lean skeleton extractor, validator gates, and static explainer compiler for the Riemann Hypothesis formal proof."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "radon>=6.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
rh-audit = "rh_pipeline.cli.audit:main"
rh-extract = "rh_pipeline.cli.extract:main"
rh-file-size-gate = "rh_pipeline.validate.file_size:main"
rh-validate = "rh_pipeline.cli.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
