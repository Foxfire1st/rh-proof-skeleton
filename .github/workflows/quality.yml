name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/bootstrap-venv.sh
      - run: scripts/check-quality.sh
