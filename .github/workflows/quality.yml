name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: radon cc src -s -a -n B
      - run: python -m rh_pipeline.validate.file_size
      - run: pytest
